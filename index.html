<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf6">
  <meta name="description" content="Christina Green — portfolio, guides, and contact.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Christina Green">
  <meta property="og:description" content="Portfolio, guides, and contact.">
  <title>Christina Green</title>
  <link rel="icon" type="image/svg+xml" href="/portfolio/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #fffaf6; --ink: #14213d; --accent: #ef715f; --muted: #566177; --line: #e9e2df; }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 16px/1.6 'DM Sans', Arial, sans-serif; }
    main { flex: 1; width: min(660px, calc(100% - 48px)); margin: auto; padding: 100px 0 90px; }
    h1 { margin: 0 0 60px; font: 400 clamp(3.5rem, 9vw, 5.7rem)/1.06 'DM Serif Display', Georgia, serif; letter-spacing: -.035em; }
    h1 span { color: var(--accent); }
    nav { border-top: 2px solid var(--ink); }
    nav a { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 25px 3px; border-bottom: 1px solid var(--line); color: inherit; font-size: clamp(1.4rem, 3.2vw, 1.85rem); font-weight: 500; text-decoration: none; transition: padding .2s, background .2s; }
    nav a:hover { padding-left: 14px; background: #fff0e9; }
    nav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    nav a span:last-child { color: var(--accent); font-size: 1.5rem; }
    footer { padding: 24px; border-top: 1px solid var(--line); text-align: center; font-size: .79rem; color: var(--muted); }
    @media (max-width: 600px) { main { padding: 80px 0; } h1 { margin-bottom: 44px; } nav a { padding: 22px 3px; } }
    @media (prefers-reduced-motion: reduce) { nav a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Christina Green<span>.</span></h1>
    <nav aria-label="Explore">
      <a href="/portfolio/"><span>Portfolio</span><span aria-hidden="true">↗</span></a>
      <a href="/portfolio/guides/"><span>Guides</span><span aria-hidden="true">↗</span></a>
      <a href="/portfolio/#contact"><span>Contact</span><span aria-hidden="true">↗</span></a>
    </nav>
  </main>
  <footer>© 2026 Christina Green</footer>
</body>
</html>
